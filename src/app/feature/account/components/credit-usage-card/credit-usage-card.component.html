<vrw-card>
  <div class="flex flex-col w-full gap-4">
    <div class="flex gap-3">
      <div class="bg-[#056839] text-white p-1 rounded-md flex items-center justify-center">
        <i class="ki-filled ki-credit-cart"></i>
      </div>
      <h2 class="text-[18px] font-bold text-foreground">Uso de Crédito</h2>
    </div>

    <div class="flex flex-col gap-2">
      <div class="flex justify-between text-sm">
        <span class="text-muted-foreground">Usado</span>
        <span class="font-semibold">{{ credit()?.creditUsed | currency:'MXN' }}</span>
      </div>
      <div class="flex justify-between text-sm">
        <span class="text-muted-foreground">Disponible</span>
        <span class="font-semibold">{{ available() | currency:'MXN' }}</span>
      </div>

      <div class="w-full bg-gray-200 rounded-full h-2 mt-2">
        <div
          class="h-2 rounded-full bg-[#056839]"
          [style.width.%]="usedPercentage() * 100"
        ></div>
      </div>
      <span class="text-xs text-muted-foreground">
        {{ usedPercentage() | percent:'1.0-1' }} del límite utilizado
      </span>
    </div>
  </div>
</vrw-card>
